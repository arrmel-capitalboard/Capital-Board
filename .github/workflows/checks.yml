name: Vérifications

# Garde-fous rapides, sans secret ni déploiement : cohérence des liens publics
# et corpus de test du filtre pub. Tourne sur chaque push et chaque PR.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

# Jeton au strict minimum : lecture seule. Explicite pour rester vrai
# si le defaut du depot change un jour.
permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Liens publics cohérents avec data/links.json
        run: node scripts/check-links.mjs

      - name: Corpus de test du filtre pub
        working-directory: discord-bot
        run: npm test

      - name: Syntaxe des fichiers JS principaux
        run: |
          node --check js/app.js
          node --check js/import.js
          node --check capital-board-worker/src/index.js
          node --check discord-bot/src/index.js

      # Ces regles sont la seule chose qui separe une capture d'audit d'une fuite
      # d'identifiants. Voir l'en-tete de scripts/caviardage.mjs.
      - name: Caviardage des captures d'audit
        working-directory: scripts
        run: node --test caviardage.test.mjs

      - name: Calcul des livrets
        run: node scripts/t-livrets.cjs

      - name: Parseur de relevés
        run: node scripts/t-import.cjs

      - name: Positions crypto
        run: node scripts/t-crypto.cjs

      # Les suites ci-dessous existaient sans jamais tourner ici : une suite
      # qu'aucune CI ne lance ne protège de rien.
      - name: Socle de calcul — PRU, P&L réalisé, solde espèces
        run: node scripts/t-pnl.cjs

      - name: Versements
        run: node scripts/t-versements.cjs

      - name: Pastilles achat / vente
        run: node scripts/t-marqueurs.cjs

      - name: Attributions gratuites (rompus)
        run: node scripts/t-ost.cjs

      - name: Réconciliation d'un PEA
        run: node scripts/t-reconcile.cjs

      # Contrôle d'accès et trace d'audit de l'export administrateur : ce qui
      # sépare un outil de diagnostic d'un accès non journalisé aux avoirs d'un
      # membre.
      - name: Export administrateur
        run: node scripts/t-admin-export.mjs

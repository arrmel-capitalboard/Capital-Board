name: Déploiement bot Discord

# Déploie le bot sur la VM GCP à chaque push touchant discord-bot/.
on:
  push:
    branches: [main]
    paths:
      - 'discord-bot/**'
  workflow_dispatch: {} # permet aussi un déclenchement manuel depuis l'onglet Actions

concurrency:
  group: deploy-bot
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement SSH sur la VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/Capital-Board
            git fetch --quiet origin main
            git reset --hard origin/main
            bash discord-bot/scripts/deploy.sh

name: Déploiement bot Discord

# Déploie le bot sur la VM GCP à chaque push touchant discord-bot/.
on:
  push:
    branches: [main]
    paths:
      - 'discord-bot/**'
  workflow_dispatch: {} # permet aussi un déclenchement manuel depuis l'onglet Actions

concurrency:
  group: deploy-bot
  cancel-in-progress: false

jobs:
  # Le corpus de test tourne avant le déploiement : une régression du filtre pub
  # bloque la mise en production au lieu d'atterrir sur la VM.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - working-directory: discord-bot
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement SSH sur la VM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/Capital-Board
            git fetch --quiet origin main
            git reset --hard origin/main
            bash discord-bot/scripts/deploy.sh

name: Déploiement bot Discord

# Déploie le bot sur la VM GCP à chaque push touchant discord-bot/.
on:
  push:
    branches: [main]
    paths:
      - 'discord-bot/**'
  workflow_dispatch: {} # permet aussi un déclenchement manuel depuis l'onglet Actions

concurrency:
  group: deploy-bot
  cancel-in-progress: false

# Jeton au strict minimum : lecture seule. Explicite pour rester vrai
# si le defaut du depot change un jour.
permissions:
  contents: read

jobs:
  # Garde anti-secrets, BLOQUANTE : scanne l'arbre reellement deploye (fichiers
  # sur disque, pas seulement l'historique git) avec la meme config que le
  # workflow Gitleaks. Un secret present ici fait echouer le job, et le
  # deploiement qui en depend ne part pas.
  garde-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Scan secrets (bloquant)
        run: |
          set -euo pipefail
          V=8.18.4
          curl -sSfL --retry 5 --retry-all-errors --retry-delay 3 --connect-timeout 20 "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" -o gl.tgz
          tar -xzf gl.tgz gitleaks
          if ! ./gitleaks detect --source . --no-git --config .gitleaks.toml --redact --exit-code 1; then
            echo "::error::Secret detecte dans l'arbre a deployer — deploiement bloque."
            exit 1
          fi

  # Le corpus de test tourne avant le déploiement : une régression du filtre pub
  # bloque la mise en production au lieu d'atterrir sur la VM.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
      - working-directory: discord-bot
        run: npm test

  deploy:
    needs: [test, garde-secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Déploiement SSH sur la VM
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          script: |
            set -e
            cd ~/Capital-Board
            git fetch --quiet origin main
            git reset --hard origin/main
            bash discord-bot/scripts/deploy.sh

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  # Garde anti-secrets, BLOQUANTE : scanne l'arbre reellement deploye (fichiers
  # sur disque, pas seulement l'historique git) avec la meme config que le
  # workflow Gitleaks. Un secret present ici fait echouer le job, et le
  # deploiement qui en depend ne part pas.
  garde-secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan secrets (bloquant)
        run: |
          set -euo pipefail
          V=8.18.4
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${V}/gitleaks_${V}_linux_x64.tar.gz" -o gl.tgz
          tar -xzf gl.tgz gitleaks
          if ! ./gitleaks detect --source . --no-git --config .gitleaks.toml --redact --exit-code 1; then
            echo "::error::Secret detecte dans l'arbre a deployer — deploiement bloque."
            exit 1
          fi

  deploy:
    needs: garde-secrets
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v4

      # Le dépôt entier était publié : capitalboard.fr servait afaire.md,
      # discord-bot/, scripts/, firestore.rules et le reste — tout répondait 200
      # et robots.txt laissait les moteurs les indexer. Le site est désormais
      # assemblé à partir de ce dont il a besoin, et de rien d'autre.
      - name: Assemblage du site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp pages/index.html pages/app.html pages/auth-action.html pages/soutien.html pages/404.html _site/
          cp -r assets css js data communaute guides legal _site/
          cp manifest.json firebase-messaging-sw.js robots.txt sitemap.xml CNAME _site/
          # data/app-help.md alimente la base de connaissances du chatbot,
          # construite en CI : le site n'a aucune raison de le servir.
          find _site -name '*.md' -delete
          echo "Contenu publié :"
          find _site -maxdepth 1 -mindepth 1 | sort

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'

      - uses: actions/deploy-pages@v4
        id: deployment

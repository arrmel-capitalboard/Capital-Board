name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v4

      - name: Prepare artifact
        run: cp pages/index.html index.html && cp pages/app.html app.html && cp pages/auth-action.html auth-action.html && cp pages/404.html 404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - uses: actions/deploy-pages@v4
        id: deployment

      # Publie une annonce Discord uniquement si le commit porte un trailer
      # « Annonce: » (voir scripts/announce-deploy.js). Le runner ne fait que
      # détecter et parser ; le post est fait sur la VM avec le token du bot
      # qui y réside déjà — le token ne transite jamais par GitHub.
      - name: Détecter une annonce
        id: annonce
        run: node scripts/announce-deploy.js

      - name: Publier l'annonce sur Discord
        if: steps.annonce.outputs.publish == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          ANNOUNCE_TITLE: ${{ steps.annonce.outputs.title }}
          ANNOUNCE_DESC: ${{ steps.annonce.outputs.desc }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: ANNOUNCE_TITLE,ANNOUNCE_DESC
          script: |
            cd ~/Capital-Board
            node discord-bot/scripts/post-announce.js

name: File des nouveautés

# À chaque push sur main, met en file de validation les commits « feat »
# (voir scripts/queue-feature.mjs). Le bot Discord poste ensuite un message
# de validation ; l'envoi communautaire a lieu le lundi (côté bot).
on:
  push:
    branches: [main]

# Jeton au strict minimum : lecture seule. Explicite pour rester vrai
# si le defaut du depot change un jour.
permissions:
  contents: read

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd scripts
          npm install

      - name: Mettre en file les nouveautés
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Réécriture du sujet de commit en phrase lisible par un utilisateur.
          # Absente, le script retombe sur la traduction mot à mot.
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
        run: |
          cd scripts
          node queue-feature.mjs

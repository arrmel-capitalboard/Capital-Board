name: Nouveautés du jour

# Tous les matins, relit les commits de la VEILLE et met en file de validation
# quelques phrases écrites pour les membres (voir scripts/news-daily.mjs et
# nouveautes.md). Le bot Discord poste un message par proposition dans le salon
# de validation ; la publication communautaire reste celle du lundi 18h.
#
# Avant, ce workflow tournait à chaque push et créait une entrée par commit :
# onze commits dans la soirée donnaient six messages à valider pour trois
# vraies nouveautés, écrites dans la langue du dépôt et non dans celle des
# membres. Une lecture par journée permet de regrouper et d'écarter.
on:
  schedule:
    # 08h00 UTC = 10h heure de Paris l'été, 9h l'hiver. Même convention que
    # les autres tâches du dépôt : on ne cale pas le cron sur le changement
    # d'heure, la fenêtre lue est celle de la veille entière.
    - cron: '0 8 * * *'
  workflow_dispatch:
    inputs:
      jour:
        description: 'Jour à relire (AAAA-MM-JJ). Vide = la veille.'
        required: false
        default: ''

# Jeton au strict minimum : lecture seule. Explicite pour rester vrai
# si le defaut du depot change un jour.
permissions:
  contents: read

jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          # Le script lit l'historique d'une journée : un checkout superficiel
          # ne ramènerait que le dernier commit.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd scripts
          npm install

      - name: Relire la journée et mettre en file
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          # Sans elle, rien n'est mis en file : recopier des sujets de commit
          # est exactement ce que cette réécriture cherche à éviter.
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          JOUR_CIBLE: ${{ inputs.jour }}
        run: |
          cd scripts
          node news-daily.mjs

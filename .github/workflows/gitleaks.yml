name: Gitleaks

# Filet de sécurité anti-secrets, indépendant du hook local (.githooks/pre-commit)
# qui ne s'active que si gitleaks est installé sur le poste du contributeur.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITLEAKS_CONFIG: .gitleaks.toml
          # Exigé depuis la mise à jour de gitleaks-action pour scanner les PR.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Firestore rules

# Tests des Security Rules contre l'émulateur — dans son propre workflow (pas
# checks.yml) parce que le démarrage de l'émulateur Firestore prend nettement
# plus longtemps que les vérifications rapides qui y tournent déjà.
on:
  push:
    branches: [main]
    paths:
      - 'firestore.rules'
      - 'firestore-tests/**'
  pull_request:
    paths:
      - 'firestore.rules'
      - 'firestore-tests/**'
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rules-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          cd firestore-tests
          npm install

      - name: Install firebase-tools
        run: npm install -g firebase-tools

      - name: Run rules tests against the emulator
        # Depuis la racine : firebase.json (emulators + firestore.rules) y vit,
        # et emulators:exec le cherche dans le répertoire courant.
        run: firebase emulators:exec --project capitalboard-rules-test --only firestore "npm --prefix firestore-tests test"

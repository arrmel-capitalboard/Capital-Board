name = "capital-board-worker"
main = "src/index.js"
compatibility_date = "2024-01-01"
# Compte Cloudflare contenant la zone capitalboard.fr + KV (admin.capitalboard's Account).
# Requis car le token a accès à plusieurs comptes (déploiement CI non-interactif).
account_id = "a65353958bd95d79802b9cd59831a890"

[vars]
ALLOWED_ORIGIN = "https://capitalboard.fr"
FIREBASE_PROJECT_ID = "capitalboard"
FIREBASE_WEB_API_KEY = "AIzaSyBnHkOTwFoJNMvYOgG7Ne-AFKgE3GBRiNU"
ADMIN_UID = "A6nZQ8PcxdURytSesA17xK81I9T2"
# Contenus favoris (GET /favoris) : source RSS de secours, au format
# « Libellé|url », séparés par des virgules. Elle servait de source principale
# tant qu'Instagram n'était lisible que par une passerelle externe (RSS.app,
# FetchRSS). Vidée le 2026-07-25 : la Graph API ci-dessous couvre les mêmes
# comptes, sans plafond de 2 flux et sans essai qui expire. À ne réutiliser que
# pour un compte qui refuserait de passer en professionnel.
FAVORIS_FEEDS = ""

# Deuxième source des favoris : Graph API `business_discovery`, sans limite de
# nombre de comptes (les passerelles RSS gratuites plafonnent à 2 flux). Liste
# de handles Instagram séparés par des virgules, le @ est optionnel. Les comptes
# visés doivent être **professionnels** (Créateur ou Business) : un compte perso
# ne renvoie rien et reste à couvrir par un flux RSS ci-dessus.
# Nécessite les secrets IG_USER_ID et IG_GRAPH_TOKEN ; sans eux la liste est ignorée.
FAVORIS_IG_HANDLES = "zonebourse,seqo.oia,laurent.cosmos.finance,aktionnaire,matthiasbaccino,parlonsfinance,pea.fr,jeanbenoit_gambet,analystecurieux"

# Cache earnings : 1 clé par symbole (earn:SYM, TTL 24h) + creds Yahoo (crumb).
# Source = Yahoo calendarEvents (global, pas de clé API). Finnhub abandonné (US-only).
[[kv_namespaces]]
binding = "EARNINGS"
id = "994d84c5a364477e869b4fb12605a57d"

# Pieces jointes des tickets de support (POST /support-upload).
# Firebase Storage exigerait le plan Blaze ; R2 rend le meme service sur le
# palier gratuit. Bucket a creer une fois :
#   wrangler r2 bucket create capital-board-support
# Decommenter APRES avoir cree le bucket, sinon le deploiement echoue avec
# « R2 bucket not found » et bloque toute mise a jour du Worker :
#   wrangler r2 bucket create capital-board-support
# Sans ce binding, /support-upload repond 503 et le reste du Worker fonctionne.
# [[r2_buckets]]
# binding = "SUPPORT_FILES"
# bucket_name = "capital-board-support"

# Workers AI : chatbot d'aide (POST /chat). Modèle Llama gratuit sous quota.
# Base de connaissance = capital-board-worker/src/kb.js (généré par
# scripts/build-kb.mjs à partir du contenu public du site).
[ai]
binding = "AI"

# Cron : vérifie toutes les 5 min les diffusions email programmées (scheduled()).
[triggers]
crons = ["*/5 * * * *"]

# Secrets à injecter via : wrangler secret put <NOM>
#   FIREBASE_SERVICE_ACCOUNT   → JSON complet du service account Firebase
#   RESEND_API_KEY             → clé API Resend
#   IG_USER_ID                 → id du compte Instagram pro lié à notre Page Facebook
#   SUPPORT_FILES_SECRET       → chaine aleatoire, signe les URL des pieces jointes
#   IG_GRAPH_TOKEN             → jeton de Page Facebook (n'expire pas), scopes
#                                instagram_basic + pages_show_list + pages_read_engagement
